name: "AWS CodeArtifact login Action"
description: Github Action to fetch a token for AWS CodeArtifact and (optionally) retrieve a repository URL
inputs:
  domain:
    description: CodeArtifact domain to which the package repository belongs
    required: true
  accountId:
    description: Owner (AWS Account) of the CodeArtifact domain
    required: true
  repository:
    description: CodeArtifact repository for which to optionally fetch the URL
    required: true
  region:
    description: AWS Region
    required: false
    default: "us-east-1"
  scope:
    description: Configure tool with temporary CodeArtifact credentials
    required: false
    default: ""
  packageType:
    description: Tool Type
    required: false
    default: "npm"
  defaultRepository:
    description: >-
      CodeArtifact repository to point the tool's DEFAULT registry at — the one
      holding an external connection to the public registry (e.g. `npm-store`).
      Public packages then resolve through CodeArtifact inside AWS instead of
      egressing to npmjs.com over the NAT gateway, which is the single largest
      line item in the cmp-tools bill (API-2126). Empty = unchanged behaviour:
      only the scoped registry is configured and public traffic still goes over
      NAT.
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - id: install-aws-cli
      uses: unfor19/install-aws-cli-action@v1
      with:
        version: 2
    - name: Configure package managers
      shell: bash
      run: |
        aws --version
        node -v
        aws codeartifact login --tool ${{ inputs.packageType }} --region ${{ inputs.region }} --domain ${{ inputs.domain }} --domain-owner ${{ inputs.accountId }} --repository ${{ inputs.repository }} --namespace ${{ inputs.scope }}
    - name: Point the default registry at the store repository
      # Runs SECOND and without --namespace, which is what makes it write the
      # default `registry=` key rather than a scoped one. The two are separate
      # npmrc keys, so the scoped login above survives untouched and our own
      # @scope packages keep resolving from their own repository.
      if: inputs.defaultRepository != ''
      shell: bash
      run: |
        aws codeartifact login --tool ${{ inputs.packageType }} --region ${{ inputs.region }} --domain ${{ inputs.domain }} --domain-owner ${{ inputs.accountId }} --repository ${{ inputs.defaultRepository }}

